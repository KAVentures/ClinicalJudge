[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaljudge"
version = "0.2.0"
description = "Independent, reproducible clinical AI evaluation framework with human validation tooling"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ClinicalJudge contributors"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
preceptron = ["openai>=1.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clinicaljudge = "clinicaljudge.cli:main"

[tool.setuptools.packages.find]
include = ["clinicaljudge*"]

[tool.setuptools.package-data]
clinicaljudge = ["rubrics/*.json"]
