name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m clinicaljudge lint --input examples/cases.jsonl
      - run: python scripts/prepare_healthbench_physician50.py --output-dir runs/healthbench_physician50
      - run: python -m clinicaljudge lint --input runs/healthbench_physician50/cases_blinded.jsonl